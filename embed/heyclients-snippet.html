<!--
  Paste ONE of these into a HeyClients "Custom HTML / Code" block.
  Replace https://editor.yourdomain.com with the address of your deployed editor.
-->

<!-- Option A (recommended on phones): a button that opens the editor full-screen -->
<a href="https://editor.yourdomain.com"
   style="display:inline-block;padding:16px 28px;border-radius:14px;background:#ff3ea5;color:#fff;
          font:600 18px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-decoration:none;">
  Open Reel Editor
</a>

<!-- Option B: show the editor right inside the page -->
<iframe src="https://editor.yourdomain.com"
        title="Reel Editor"
        allow="web-share; fullscreen; clipboard-write"
        style="width:100%;height:90vh;min-height:640px;border:0;border-radius:16px;background:#111;">
</iframe>
